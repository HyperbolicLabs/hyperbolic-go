# OpenAPI Overlay (https://spec.openapis.org/overlay/v1.0.0) applied to
# openapi.json before generating the SDK. Each group fixes a problem in the
# published spec, and README.md in this directory lists them for the API's
# owners. Delete a group once the published spec carries the fix.
# `make generate` fails on an action whose target no longer matches.
overlay: 1.0.0
info:
  title: hyperbolic-go fixes to the Hyperbolic API spec
  version: 1.0.0
