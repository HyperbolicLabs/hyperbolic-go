name: Bug report
description: Something is not working as documented
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: "Remove API keys and other secrets from anything you paste. Security issues go through SECURITY.md, not here."
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.1.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output (errors, logs, request and response with keys removed)
      render: shell
